[platformio]
default_envs = native
src_dir = firmware/src
include_dir = firmware/include
test_dir = firmware/test

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
    +<*>
    -<main.cpp>
    -<platform/stm32/**>
build_unflags =
    -std=gnu++11
    -std=gnu++14
build_flags =
    -std=c++17
    -DGRAVIMETRA_HOST_BUILD=1
    -DUNITY_INCLUDE_DOUBLE=1
    -Wall
    -Wextra
    -Wpedantic
    -Wconversion
    -Wshadow

; The NUCLEO-G491RE manifest is used only as PlatformIO's verified
; STM32G491RET6 toolchain/startup carrier. GraviMetra does not inherit the
; Nucleo connector pinout. The production pin map remains intentionally
; unreleased until it is validated in CubeMX and against the schematic.
[env:gravimetra_g491]
platform = ststm32@19.7.1
board = nucleo_g491re
framework = stm32cube
upload_protocol = stlink
build_src_filter =
    +<*>
    -<platform/host/**>
build_unflags =
    -std=gnu++11
    -std=gnu++14
build_flags =
    -std=c++17
    -DGRAVIMETRA_TARGET_STM32G491=1
    -Wall
    -Wextra
